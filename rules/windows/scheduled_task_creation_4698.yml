title: Scheduled Task Created
id: acf8ae0e-8e16-4856-b38e-862dc3d5c6b9
status: experimental
description: |
  Detects creation of a Windows scheduled task via Security event ID 4698.
  Scheduled tasks are a common persistence and execution mechanism. Lab-scoped:
  requires the "Audit Other Object Access Events" subcategory to be enabled on
  the monitored host. Pair with an allowlist of known-good task names.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4698
author: Danny Stanfield
date: 2026-10-08
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4698
  suspicious_content:
    TaskContent|contains:
      - 'cmd.exe'
      - 'powershell'
      - 'mshta'
      - 'rundll32'
      - 'regsvr32'
      - '\Temp\'
      - '\AppData\'
  condition: selection and suspicious_content
falsepositives:
  - Software installers and updaters that register scheduled tasks
  - Administrator-created maintenance tasks
level: medium
