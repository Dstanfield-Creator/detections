title: New Windows Service Installed via Suspicious Image Path
id: c86228c1-2094-4fc2-87da-42f2450e48fe
status: experimental
description: |
  Detects installation of a new Windows service (Service Control Manager event
  ID 7045) whose binary path points at a script interpreter, a user-writable
  location, or a temporary directory. Attackers register services for
  persistence and privileged execution. Lab-scoped: tuned against a home SOC
  Windows endpoint running Sysmon and forwarding the System event log.
references:
  - https://attack.mitre.org/techniques/T1543/003/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-7045
author: Danny Stanfield
date: 2026-10-08
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1543.003
logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  suspicious_path:
    ImagePath|contains:
      - '\Users\'
      - '\AppData\'
      - '\Temp\'
      - 'cmd.exe'
      - 'powershell.exe'
      - 'pwsh.exe'
      - 'rundll32.exe'
      - 'regsvr32.exe'
  condition: selection and suspicious_path
falsepositives:
  - Legitimate software installers that stage service binaries in temporary paths
  - Management agents deployed by administrators
level: high
