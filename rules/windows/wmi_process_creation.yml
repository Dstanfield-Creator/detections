title: Process Spawned by WMI Provider Host
id: 62874c9c-ac60-4af3-bb06-d96ad0d685f8
status: experimental
description: |
  Detects command interpreters and common living-off-the-land binaries created
  as child processes of WmiPrvSE.exe. WMI is frequently abused for remote
  command execution and lateral movement. Lab-scoped: requires Sysmon process
  creation logging (event ID 1) on the monitored Windows host.
references:
  - https://attack.mitre.org/techniques/T1047/
  - https://learn.microsoft.com/en-us/windows/win32/wmisdk/wmi-start-page
author: Danny Stanfield
date: 2026-10-08
tags:
  - attack.execution
  - attack.t1047
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith: '\WmiPrvSE.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection
falsepositives:
  - Legitimate administrative scripts executed through WMI
  - Monitoring or inventory agents that query WMI
level: high
