title: LSASS Process Access With Credential Dumping Access Rights
id: ac6b5055-6b01-4902-a8f6-7ce6c9e426b7
status: experimental
description: |
  Detects handle requests against lsass.exe that grant the access masks
  commonly used to read process memory for credential theft (for example
  0x1010 and 0x1410). Based on Sysmon ProcessAccess (event ID 10). Lab-scoped:
  tuned to reduce noise from known security tooling on the monitored host.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://github.com/SwiftOnSecurity/sysmon-config
author: Danny Stanfield
date: 2026-10-08
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_known:
    SourceImage|endswith:
      - '\wmiprvse.exe'
      - '\MsMpEng.exe'
  condition: selection and not filter_known
falsepositives:
  - Endpoint protection and backup agents that legitimately read process memory
  - Crash reporting tools
level: high
