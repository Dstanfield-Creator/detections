title: Bash Reverse Shell via /dev/tcp
id: 3b4c857f-20dd-475c-bd46-261916a8d128
status: experimental
description: |
  Detects interactive shells redirected to a network socket through the bash
  /dev/tcp or /dev/udp pseudo-devices, a common reverse shell technique.
  Lab-scoped: requires process creation telemetry (auditd execve or Sysmon for
  Linux event ID 1) with the full command line captured.
references:
  - https://attack.mitre.org/techniques/T1059/004/
  - https://gtfobins.github.io/gtfobins/bash/
author: Danny Stanfield
date: 2026-10-08
tags:
  - attack.execution
  - attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  selection_socket:
    CommandLine|contains:
      - '/dev/tcp/'
      - '/dev/udp/'
  selection_shell:
    CommandLine|contains:
      - 'bash -i'
      - 'sh -i'
      - '0<&'
      - '>&'
  condition: selection_socket and selection_shell
falsepositives:
  - Developers testing network connectivity with bash built-ins
  - Health-check scripts that open TCP sockets through /dev/tcp
level: high
